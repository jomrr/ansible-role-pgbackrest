---
# role: pgbackrest
# file: molecule/resources/playbooks/verify.yml

- name: PGBACKREST | Verify local and SSH backup and restore
  hosts: all
  gather_facts: true
  tasks:

    - name: PGBACKREST | Check database and WAL archiving
      become: true
      become_user: postgres
      ansible.builtin.command:
        cmd: pgbackrest --stanza=main check
      changed_when: false

    - name: PGBACKREST | Create recoverable test data
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        login_unix_socket: /var/lib/pgbackrest-test
        login_port: 55432
        query: CREATE TABLE IF NOT EXISTS backup_test (value text); TRUNCATE backup_test; INSERT INTO backup_test
          VALUES ('pgbackrest-restore-ok');

    - name: PGBACKREST | Create full backups in both repositories
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - pgbackrest
          - --stanza=main
          - --repo={{ __pgbackrest_test_repo }}
          - --type=full
          - backup
      changed_when: true
      loop:
        - 1
        - 2
      loop_control:
        loop_var: __pgbackrest_test_repo

    - name: PGBACKREST | Create a differential remote backup
      become: true
      become_user: postgres
      ansible.builtin.command:
        cmd: pgbackrest --stanza=main --repo=2 --type=diff backup
      changed_when: true

    - name: PGBACKREST | Back up through the remote database connection
      become: true
      become_user: postgres
      ansible.builtin.command:
        cmd: pgbackrest --config=/etc/pgbackrest/repository.conf --stanza=main --repo=2 --type=incr backup
      changed_when: true

    - name: PGBACKREST | Read backup inventory
      become: true
      become_user: postgres
      ansible.builtin.command:
        cmd: pgbackrest --stanza=main --output=json info
      changed_when: false
      register: __pgbackrest_test_info

    - name: PGBACKREST | Verify both repositories contain recoverable backups
      ansible.builtin.assert:
        that:
          - (__pgbackrest_test_info.stdout | from_json)[0].status.code == 0
          - (__pgbackrest_test_info.stdout | from_json)[0].backup | length >= 3
        quiet: true

    - name: PGBACKREST | Locate PostgreSQL restore binaries
      ansible.builtin.command:
        cmd: /usr/bin/pg_config --bindir
      register: __pgbackrest_test_bindir
      changed_when: false
      when: ansible_facts.os_family == 'Debian'

    - name: PGBACKREST | Restore and read each backup
      ansible.builtin.include_tasks: ../tasks/restore.yml
      loop:
        - repo: 1
          name: local
          port: 55433
        - repo: 2
          name: remote
          port: 55434
      loop_control:
        loop_var: __pgbackrest_test_restore
        label: '{{ __pgbackrest_test_restore.name }}'

    - name: PGBACKREST | Verify configuration permissions
      become: true
      become_user: root
      ansible.builtin.stat:
        path: /etc/pgbackrest/pgbackrest.conf
      register: __pgbackrest_test_config

    - name: PGBACKREST | Assert configuration is private
      ansible.builtin.assert:
        that:
          - __pgbackrest_test_config.stat.mode == '0640'
          - __pgbackrest_test_config.stat.pw_name == 'root'
          - __pgbackrest_test_config.stat.gr_name == 'postgres'
        quiet: true
